{{- if not .Values.pantech.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pantech-csi.secretName" . }}
  namespace: {{ include "pantech-csi.namespace" . }}
  labels:
    {{- include "pantech-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  PANTECH_API_URL: {{ required "pantech.apiUrl is required" .Values.pantech.apiUrl | quote }}
  PANTECH_API_KEY: {{ required "pantech.apiKey is required" .Values.pantech.apiKey | quote }}
  {{- if .Values.pantech.region }}
  PANTECH_REGION: {{ .Values.pantech.region | quote }}
  {{- end }}
  PANTECH_AVAILABILITY_ZONE: {{ required "pantech.availabilityZone is required" .Values.pantech.availabilityZone | quote }}
  PANTECH_DISK_OFFERING: {{ required "pantech.diskOffering is required" .Values.pantech.diskOffering | quote }}
{{- end }}
