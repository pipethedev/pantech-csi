{{- if .Values.serviceAccount.controller.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pantech-csi.controllerServiceAccountName" . }}
  namespace: {{ include "pantech-csi.namespace" . }}
  labels:
    {{- include "pantech-csi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.controller.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if .Values.serviceAccount.node.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pantech-csi.nodeServiceAccountName" . }}
  namespace: {{ include "pantech-csi.namespace" . }}
  labels:
    {{- include "pantech-csi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.node.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
